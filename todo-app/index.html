<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quản Lý Công Việc</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="container">
    <h1>Todo List</h1>
    <div class="input-section">
      <input type="text" id="task-input" placeholder="Nhập công việc..." />
      <button onclick="addTask()">Thêm công việc</button>
    </div>

    <div class="filter-section">
      <button onclick="filterTasks('all')">Tất cả</button>
      <button onclick="filterTasks('active')">Chưa hoàn thành</button>
      <button onclick="filterTasks('done')">Đã hoàn thành</button>
    </div>

    <ul id="task-list"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
